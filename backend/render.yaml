services:
  - type: web
    name: athena-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false
      - key: DEFAULT_MODEL
        value: openai/gpt-oss-120b
      - key: FALLBACK_MODEL
        value: qwen/qwen3.8-27b
      - key: USE_DDG_SEARCH
        value: "true"
